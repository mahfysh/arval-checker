name: Arval monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # co 30 min
  workflow_dispatch:          # przycisk "Run workflow" do recznego uruchomienia

permissions:
  contents: write

concurrency:
  group: arval-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdz nowe auta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Zapisz stan
        run: |
          git config user.name "arval-bot"
          git config user.email "arval-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
